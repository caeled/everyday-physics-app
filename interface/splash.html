<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Everyday Physics</title>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: #0a141f;
    color: #d9e5ed;
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 18px;
    padding: 24px;
    cursor: pointer;
    overflow: hidden;
  }
  .art {
    max-width: min(880px, 92vw);
    width: 100%;
    height: auto;
    border: 4px solid #f5c369;
    border-radius: 20px;
    box-shadow: 0 18px 50px rgba(0, 0, 0, 0.5);
  }
  h1 {
    margin: 0;
    font-family: Georgia, "Times New Roman", serif;
    font-size: clamp(30px, 4.5vw, 46px);
    line-height: 1.05;
    text-align: center;
  }
  h1 em { color: #f5c369; font-style: italic; }
  .pill {
    display: inline-block;
    background: #7fdddb;
    color: #0a141f;
    border-radius: 999px;
    padding: 5px 16px;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 0.14em;
    text-transform: uppercase;
  }
  .hint {
    margin: 0;
    font-size: 16px;
    opacity: 0.92;
    animation: pulse 1.6s ease-in-out infinite;
  }
  @keyframes pulse { 0%, 100% { opacity: 0.55; } 50% { opacity: 1; } }
</style>
</head>
<body>
  <img class="art" src="everyday-physics-banner.jpg" alt="A friendly robot with safety goggles pushed up on its head, lining up a pool shot on a small green pool table, dotted trajectory lines and angle marks over the felt, and a little wooden ballistics launcher beside the table.">
  <h1>Everyday <em>Physics</em></h1>
  <span class="pill">The physics room, on its own</span>
  <p class="hint">Tap anywhere to enter</p>
<script>
  var gone = false;
  function enter() {
    if (gone) return;
    gone = true;
    window.location.href = 'index.html';
  }
  window.addEventListener('load', function () { setTimeout(enter, 6000); });
  document.addEventListener('click', enter);
  document.addEventListener('keydown', enter);
</script>
</body>
</html>
