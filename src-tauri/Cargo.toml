[package]
name = "everyday-physics-app"
version = "1.0.0"
description = "Everyday Physics desktop shell"
authors = ["Steven Powell"]
edition = "2021"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
